<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/PIL.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <meta name="description" content="PIL is an advanced enterprise mobility solution designed to secure corporate devices through real-time policy enforcement and permission management." />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/PIL.png" />

  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" id="manifest-link" href="%PUBLIC_URL%/manifest.json" />
  <script>
    (function () {
      const path = window.location.pathname;
      const manifestLink = document.getElementById('manifest-link');
      if (path.startsWith('/full')) {
        manifestLink.setAttribute('href', '%PUBLIC_URL%/manifest-full.json');
      } else if (path.startsWith('/qrapp')) {
        manifestLink.setAttribute('href', '%PUBLIC_URL%/manifest-qrapp.json');
      }
    })();
  </script>
  <title>PIL</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
